# 日志系统配置文件(logger.conf)
# 放在程序的工作目录即可,程序第一次打日志时会自动加载;
# 也可以在代码中调用 logger::initFromFile("路径") 显式指定。
# 注意:# 开头整行才是注释,key 与 value 大小写不敏感。

# 日志级别:debug / info / warn / error(或 0~3)
level = debug

# 输出格式,可用占位符:
#   %t  时间(YYYY-MM-DD HH:MM:SS)
#   %l  日志级别(DEBUG / INFO / WARN / ERROR)
#   %T  线程 id
#   %m  消息正文
#   %%  字面量 '%'
# 格式末尾会自动补换行。
format = [%t] [%l] [tid=%T] %m

# 输出朝向(可扩展,逗号分隔多个目标):
#   console - 控制台   file - 文件
target = console,file

# 日志文件路径(仅 target 含 file 时生效)
file = server.log

# 异步日志队列容量(0 表示默认 65536)
queue_capacity = 65536
